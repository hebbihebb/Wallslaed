[package]
name = "wallslaed"
version = "0.1.0"
edition = "2021"
description = "Wallslæd wallpaper rotation daemon and CLI"
license = "GPL-3.0-or-later"

[[bin]]
name = "wallslaed"
path = "src/main.rs"

[dependencies]
gio = "0.22"
glib = { version = "0.22", features = ["v2_72"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
fast_image_resize = { version = "6", features = ["image"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
